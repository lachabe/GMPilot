name: Dependency Review

# Sur chaque PR : bloque l'introduction d'une dépendance avec une vulnérabilité
# connue (severity >= moderate). Complète Dependabot, qui lui alerte APRÈS coup.
# Gratuit sur repo public (dependency graph déjà actif).

on: pull_request

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
